<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#0ba35a"> <link rel="shortcut icon" type="image/png" href="https://i.imghippo.com/files/F2741Cc.png" />
    <title>SMK-DATA</title>
    
    <link rel="manifest" href="manifest-v2.json">

    <style>
        /* Reset CSS */
        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; 
            height: 100%; width: 100%;
            overflow: hidden; 
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }
        
        body { display: flex; flex-direction: column; }
        
        /* === LOADING SCREEN (Updated Color) === */
        #loading-screen {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100vh;
            
            /* Warna Latar Hijau sesuai permintaan */
            background-color: #0ba35a; 
            
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            
            z-index: 2000;
        }
        
        #loading-text {
            text-align: center;
            font-size: 18px;
            
            /* Warna teks diubah jadi Putih agar terbaca di background hijau */
            color: #ffffff; 
            
            font-weight: bold;
            line-height: 1.6;
            width: 100%;
            padding: 0 20px;
            margin: 0;
        }

        /* === LAYAR AKSES DITOLAK === */
        #denied-screen {
            display: none;
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100vh;
            background-color: #ffebee; 
            z-index: 2001;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            text-align: center; 
            padding: 30px; 
            color: #c62828;
        }
        #denied-screen h2 { margin-top: 0; margin-bottom: 10px; }

        #appFrame { 
            flex-grow: 1; border: none; width: 100%; height: 100%;
            visibility: hidden;
        }

        #installButton {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); z-index: 1000;
            background-color: #ffffff; color: #0ba35a; /* Diubah agar senada */
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            white-space: nowrap;
        }
        #installButton:hover { background-color: #f0f0f0; }
        
        button.retry-btn {
            margin-top: 20px; padding: 10px 20px;
            background-color: #2196F3; color: white; border: none;
            border-radius: 5px; cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div id="loading-text">
            Memuat Aplikasi<br>
            & Memeriksa Lokasi...
        </div>
    </div>

    <div id="denied-screen">
        <h2>🚫 Akses Ditolak</h2>
        <p id="denied-msg">Anda berada di luar lokasi sekolah.</p>
        <button class="retry-btn" onclick="window.location.reload()">Coba Lagi</button>
    </div>

    <iframe  
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbysv3mVMzqRqy3VKE5TIjcVwPYkgSb72JKy55LM9LCoBZ6J0xs-UuShdEtLdQxXC6cq/exec"
        allowfullscreen="true"
        allow="camera; geolocation">
        Browser Anda tidak mendukung iframe.
    </iframe>

    <button id="installButton">Install Aplikasi 🚀</button>

    <script>
        // ==========================================
        // KONFIGURASI LOKASI
        // ==========================================
        const TARGET_LAT = -7.759300000000;  // Latitude target
        const TARGET_LON = 112.728100000000; // Longitude target
        const MAX_RADIUS_METER = 2500;  // Radius izin dalam meter
        // ==========================================

        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const deniedScreen = document.getElementById('denied-screen');
        const deniedMsg = document.getElementById('denied-msg');
        const appFrame = document.getElementById('appFrame');
        const installButton = document.getElementById('installButton');

        // Fungsi Deteksi Mobile
        function isMobile() { 
            return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent); 
        }

        // Rumus Haversine
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const d = R * c; 
            return d * 1000; 
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        // Fungsi Utama untuk Memulai Aplikasi
        function initApp() {
            // LOGIKA BARU: Cek apakah Mobile atau PC
            if (isMobile()) {
                // Jika HP, jalankan Cek Lokasi
                console.log("Perangkat Mobile terdeteksi. Memulai cek lokasi...");
                checkLocation();
            } else {
                // Jika PC/Laptop, Bypass Cek Lokasi (Langsung Buka)
                console.log("PC/Laptop terdeteksi. Lokasi di-bypass.");
                loadingScreen.style.display = 'none';
                appFrame.style.visibility = 'visible';
            }
        }

        // Fungsi Cek Lokasi (Hanya dipanggil jika Mobile)
        function checkLocation() {
            if (!navigator.geolocation) {
                showDenied("Browser Anda tidak mendukung Geolocation.");
                return;
            }

            loadingText.innerHTML = "Mendeteksi<br>Lokasi Anda...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;
                    
                    const distance = getDistanceFromLatLonInMeters(userLat, userLon, TARGET_LAT, TARGET_LON);
                    
                    console.log(`Posisi: ${userLat}, ${userLon}. Jarak: ${distance.toFixed(2)} meter.`);

                    if (distance <= MAX_RADIUS_METER) {
                        // LOKASI DITERIMA
                        loadingScreen.style.display = 'none';
                        appFrame.style.visibility = 'visible';
                    } else {
                        // LOKASI DITOLAK
                        showDenied("Anda berada di luar lokasi sekolah.");
                    }
                },
                (error) => {
                    let msg = "Gagal mengambil lokasi.";
                    if (error.code === 1) msg = "Izin lokasi ditolak.<br>Mohon aktifkan GPS.";
                    else if (error.code === 2) msg = "Posisi tidak tersedia.<br>(Nyalakan GPS).";
                    else if (error.code === 3) msg = "Waktu permintaan habis.";
                    showDenied(msg);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function showDenied(message) {
            loadingScreen.style.display = 'none';
            appFrame.style.visibility = 'hidden';
            deniedScreen.style.display = 'flex';
            deniedMsg.innerHTML = message;
        }

        // Jalankan initApp saat halaman dimuat
        window.addEventListener('load', initApp);

        // --- Logic PWA & Install Button ---
        let deferredPrompt;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

        if (isStandalone) {
            installButton.style.display = 'none';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            if (!isStandalone) {
                e.preventDefault();
                deferredPrompt = e;
                if (isMobile()) {
                    installButton.style.display = 'block';
                    setTimeout(() => { if (installButton.style.display === 'block') installButton.style.display = 'none'; }, 15000);
                }
            }
        });
        
        installButton.addEventListener('click', async () => {
            installButton.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installButton.style.display = 'none';
            deferredPrompt = null;
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw-v2.js')
                    .then(registration => console.log('SW Registered'))
                    .catch(err => console.error('SW Fail:', err));
            });
        }
    </script>
</body>
</html>
